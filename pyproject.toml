[project]
name = "project2-ozhiganov-m26-555"
version = "0.1.0"
description = "Console primitive database with CRUD operations"
authors = [
    {name = "Vlad Ozhiganov", email = "slava.northern@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1,<0.5.0",
    "prettytable>=3.18.0,<4.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src" },
]

[tool.poetry.scripts]
project = "src.primitive_db.main:main"
database = "src.primitive_db.main:main"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.9,<0.17.0"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []